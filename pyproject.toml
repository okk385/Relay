[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-ssh"
version = "0.1.0"
description = "Git-native handoff worker for Codex on SSH research servers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Relay contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
relay = "relay_ssh.cli:main"

[tool.setuptools]
packages = ["relay_ssh"]
